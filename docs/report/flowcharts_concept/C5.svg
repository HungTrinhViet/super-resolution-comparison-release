<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 702" width="680" height="702" role="img" aria-labelledby="C5_title">
  <title id="C5_title">C5 · EDSR-baseline ×4</title>
  <desc>Two-line processing boxes; original technical details in nonvisible metadata and Mermaid comments.</desc>
  <metadata>[{"id": "C5_1", "correspondingLids": ["L5_A1", "L5_A2"], "details": {"L5_A1": "Ngoài timing: SHA256 → params/74 entries FP32 finite → strict/1,517,571 parameters → eval.", "L5_A2": "RGB uint8 H×W×3 → RGB FP32 [0,1], NCHW 1×3×H×W; inference_mode."}}, {"id": "C5_2", "correspondingLids": ["L5_A3"], "details": {"L5_A3": "(x−RGBmean)×255; mean=(.4488,.4371,.4040). conv_first3×3 3→64 zero-pad1 → head 1×64×H×W."}}, {"id": "C5_3", "correspondingLids": ["L5_A4"], "details": {"L5_A4": "16 lần: x + conv3(ReLU(conv3(x)))×1; cả hai conv64→64 zero-pad1; không BN; giữ H×W."}}, {"id": "C5_4", "correspondingLids": ["L5_A5"], "details": {"L5_A5": "conv_after_body3×3 64→64 zero-pad1; cộng head (global skip). FP32 1×64×H×W. Tiếp B1."}}, {"id": "C5_5", "correspondingLids": ["L5_B1"], "details": {"L5_B1": "conv3 64→256 zero-pad1 → PixelShuffle2: 1×64×2H×2W; lặp conv3/shuffle2 → 1×64×4H×4W."}}, {"id": "C5_6", "correspondingLids": ["L5_B2"], "details": {"L5_B2": "conv_last3×3 64→3 zero-pad1, tuyến tính; add_mean: x/255+RGBmean → RGB FP32 1×3×4H×4W."}}, {"id": "C5_7", "correspondingLids": ["L5_B3", "L5_B4"], "details": {"L5_B3": "Lấy batch0 ×255 → CHW intensities FP32; finite check; đếm exact-half trước lượng tử.", "L5_B4": "Finite → clamp[0,255] → torch.round half-to-even → uint8; permute/copy → RGB 4H×4W×3."}}, {"id": "C5_8", "correspondingLids": ["L5_B5"], "details": {"L5_B5": "RGB uint8 → shape check → Y float64/crop4; RGB crop4 phụ. Metric chung L1."}}]</metadata>
  <rect width="680" height="702" fill="white" />
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7 4 L0 8 Z" fill="#344054" />
    </marker>
  </defs>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="25" fill="#17212b" x="24" y="34" font-weight="700">C5 · EDSR-baseline ×4</text>
  <g id="C5_1" data-lids="L5_A1 L5_A2">
    <rect x="24" y="58" width="632" height="64" rx="8" fill="#f8fafc" stroke="#344054" stroke-width="1.4" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="20" fill="#17212b" x="36" y="84">Xác minh trọng số; nạp mạng trước khi đo</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="20" fill="#17212b" x="36" y="108">RGB uint8 /255 → FP32 1×3×H×W</text>
  </g>
  <g id="C5_2" data-lids="L5_A3">
    <rect x="24" y="136" width="632" height="64" rx="8" fill="#f8fafc" stroke="#344054" stroke-width="1.4" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="20" fill="#17212b" x="36" y="162">Trừ trung bình (0.4488,0.4371,0.4040) rồi nhân 255</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="20" fill="#17212b" x="36" y="186">Tích chập 3×3 3→64, đệm 0 rộng 1</text>
  </g>
  <g id="C5_3" data-lids="L5_A4">
    <rect x="24" y="214" width="632" height="64" rx="8" fill="#f8fafc" stroke="#344054" stroke-width="1.4" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="20" fill="#17212b" x="36" y="240">16 khối 64 kênh: tích chập 3×3 → ReLU → 3×3</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="20" fill="#17212b" x="36" y="264">Đệm 0 rộng 1; cộng đầu vào, nhánh ×1; không BN</text>
  </g>
  <g id="C5_4" data-lids="L5_A5">
    <rect x="24" y="292" width="632" height="64" rx="8" fill="#f8fafc" stroke="#344054" stroke-width="1.4" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="20" fill="#17212b" x="36" y="318">Tích chập 3×3 64→64, đệm 0 rộng 1</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="20" fill="#17212b" x="36" y="342">Cộng đặc trưng đầu qua nhánh tắt toàn cục</text>
  </g>
  <g id="C5_5" data-lids="L5_B1">
    <rect x="24" y="370" width="632" height="64" rx="8" fill="#f8fafc" stroke="#344054" stroke-width="1.4" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="20" fill="#17212b" x="36" y="396">Hai lần: tích chập 3×3 64→256 → PixelShuffle ×2</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="20" fill="#17212b" x="36" y="420">Đệm 0 rộng 1; H×W → 2H×2W → 4H×4W, 64 kênh</text>
  </g>
  <g id="C5_6" data-lids="L5_B2">
    <rect x="24" y="448" width="632" height="64" rx="8" fill="#f8fafc" stroke="#344054" stroke-width="1.4" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="20" fill="#17212b" x="36" y="474">Tích chập 3×3 64→3 tuyến tính, đệm 0 rộng 1</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="20" fill="#17212b" x="36" y="498">Chia 255, cộng trung bình → RGB FP32 1×3×4H×4W</text>
  </g>
  <g id="C5_7" data-lids="L5_B3 L5_B4">
    <rect x="24" y="526" width="632" height="64" rx="8" fill="#f8fafc" stroke="#344054" stroke-width="1.4" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="20" fill="#17212b" x="36" y="552">×255 → hữu hạn → giới hạn [0,255]</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="20" fill="#17212b" x="36" y="576">Half-to-even → RGB uint8 4H×4W×3</text>
  </g>
  <g id="C5_8" data-lids="L5_B5">
    <rect x="24" y="604" width="632" height="64" rx="8" fill="#f8fafc" stroke="#344054" stroke-width="1.4" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="20" fill="#17212b" x="36" y="630">HR/SR cùng kích thước → Y float64</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="20" fill="#17212b" x="36" y="654">Cắt 4 pixel mỗi cạnh → PSNR/SSIM Y; RGB phụ</text>
  </g>
  <path d="M 340.0 122 V 133" fill="none" stroke="#344054" stroke-width="1.4" marker-end="url(#arrow)" data-edge="C5_1 C5_2" />
  <path d="M 340.0 200 V 211" fill="none" stroke="#344054" stroke-width="1.4" marker-end="url(#arrow)" data-edge="C5_2 C5_3" />
  <path d="M 340.0 278 V 289" fill="none" stroke="#344054" stroke-width="1.4" marker-end="url(#arrow)" data-edge="C5_3 C5_4" />
  <path d="M 340.0 356 V 367" fill="none" stroke="#344054" stroke-width="1.4" marker-end="url(#arrow)" data-edge="C5_4 C5_5" />
  <path d="M 340.0 434 V 445" fill="none" stroke="#344054" stroke-width="1.4" marker-end="url(#arrow)" data-edge="C5_5 C5_6" />
  <path d="M 340.0 512 V 523" fill="none" stroke="#344054" stroke-width="1.4" marker-end="url(#arrow)" data-edge="C5_6 C5_7" />
  <path d="M 340.0 590 V 601" fill="none" stroke="#344054" stroke-width="1.4" marker-end="url(#arrow)" data-edge="C5_7 C5_8" />
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="20" fill="#17212b" x="24" y="694">H,W: kích thước LR; đánh giá sau cắt 4 pixel mỗi cạnh.</text>
</svg>
