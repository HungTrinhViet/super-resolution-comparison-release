<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1628 1578" width="1628" height="1578" role="img" aria-labelledby="L6_title L6_desc">
  <title id="L6_title">L6 · Original ESRGAN architecture ×4 · BasicSR converted weights</title>
  <desc id="L6_desc">Luồng code có module:hàm chính xác. Original ESRGAN architecture; BasicSR converted checkpoint. Conversion chain từ trọng số tác giả UNVERIFIED. RDB scale0.2 và RRDB scale0.2 là hai cấp riêng; RRDB scale toàn output RDB3, không scale (output−x). Nguồn: sr_compare.esrgan:SOURCE_NOTICE; docs/M6_ESRGAN_RESULTS.md. License/training overlap UNVERIFIED. Inference chỉ generator; không có discriminator, không mean shift; không phải Real-ESRGAN. Word: đặt từng panel riêng, rộng ít nhất 8.3 cm (chữ ≥9 pt); không ép toàn lưu đồ vào một trang. SVG giữ đủ panel/ID nối; crop/viewBox theo panel khi công cụ hỗ trợ. Import/export Word còn cần kiểm trực tiếp. Edges: [["L6_A1", "L6_A2", ""], ["L6_A2", "L6_A3", ""], ["L6_A3", "L6_A4", ""], ["L6_A4", "L6_A5", ""], ["L6_A5", "L6_A6", ""], ["L6_A4", "L6_B1", "chi tiết"], ["L6_B1", "L6_B2", "mỗi RDB"], ["L6_B2", "L6_B3", ""], ["L6_B3", "L6_B4", ""], ["L6_B4", "L6_A4", "trả về"], ["L6_A6", "L6_C1", "tiếp"], ["L6_C1", "L6_C2", ""], ["L6_C2", "L6_C3", ""], ["L6_C3", "L6_C4", ""]]</desc>
  <rect width="1628" height="1578" fill="white" />
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#344054" />
    </marker>
  </defs>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="29" fill="#17212b" x="24" y="38" font-weight="700">L6 · Original ESRGAN architecture ×4 · BasicSR converted weights</text>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="24" y="72">Đọc từ trên xuống trong từng panel; liên kết khác panel dùng ID. H,W = kích thước LR; N = 1.</text>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="24" y="106" font-weight="700">A · Generator, skip và phóng cuối</text>
  <g id="L6_A1" data-refs="sr_compare.esrgan:load_esrgan">
    <rect x="24" y="122" width="504" height="154" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="150" font-weight="700">L6_A1</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="176" font-weight="400">sr_compare.esrgan:load_esrgan</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="202" font-weight="400">Ngoài timing: SHA256 → params/702 entries</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="228" font-weight="400">finite FP32 → strict/16,697,987</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="254" font-weight="400">parameters → eval.</text>
  </g>
  <g id="L6_A2" data-refs="sr_compare.esrgan:super_resolve sr_compare.esrgan:prepare_input">
    <rect x="24" y="334" width="504" height="154" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="362" font-weight="700">L6_A2</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="388" font-weight="400">sr_compare.esrgan:super_resolve</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="414" font-weight="400">sr_compare.esrgan:prepare_input</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="440" font-weight="400">RGB uint8 H×W×3 → 1×3×H×W FP32 /255;</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="466" font-weight="400">không mean shift, inference_mode.</text>
  </g>
  <g id="L6_A3" data-refs="sr_compare.esrgan:RrdbNet.forward">
    <rect x="24" y="546" width="504" height="128" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="574" font-weight="700">L6_A3</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="600" font-weight="400">sr_compare.esrgan:RrdbNet.forward</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="626" font-weight="400">conv_first3×3 3→64, zero-pad1, tuyến tính</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="652" font-weight="400">→ head 1×64×H×W.</text>
  </g>
  <g id="L6_A4" data-refs="sr_compare.esrgan:RrdbNet.forward sr_compare.esrgan:Rrdb.forward">
    <rect x="24" y="732" width="504" height="180" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="760" font-weight="700">L6_A4</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="786" font-weight="400">sr_compare.esrgan:RrdbNet.forward</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="812" font-weight="400">sr_compare.esrgan:Rrdb.forward</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="838" font-weight="400">23 RRDB liên tiếp; chi tiết B1–B4.</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="864" font-weight="400">conv_body3×3 64→64 zero-pad1 + head →</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="890" font-weight="400">1×64×H×W.</text>
  </g>
  <g id="L6_A5" data-refs="sr_compare.esrgan:RrdbNet.forward">
    <rect x="24" y="970" width="504" height="128" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="998" font-weight="700">L6_A5</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="1024" font-weight="400">sr_compare.esrgan:RrdbNet.forward</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="1050" font-weight="400">nearest×2 → conv_up1 64→64 → LReLU.2; lặp</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="1076" font-weight="400">nearest×2/conv_up2/LReLU.2 → 1×64×4H×4W.</text>
  </g>
  <g id="L6_A6" data-refs="sr_compare.esrgan:RrdbNet.forward">
    <rect x="24" y="1156" width="504" height="154" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="1184" font-weight="700">L6_A6</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="1210" font-weight="400">sr_compare.esrgan:RrdbNet.forward</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="1236" font-weight="400">conv_hr64→64/LReLU.2 → conv_last64→3</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="1262" font-weight="400">tuyến tính; mọi conv3×3 zero-pad1. Tiếp</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="1288" font-weight="400">C1.</text>
  </g>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="556" y="106" font-weight="700">B · Chi tiết lồng trong A4</text>
  <g id="L6_B1" data-refs="sr_compare.esrgan:Rrdb.forward">
    <rect x="556" y="122" width="504" height="128" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="150" font-weight="700">L6_B1</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="176" font-weight="400">sr_compare.esrgan:Rrdb.forward</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="202" font-weight="400">Một RRDB: r=RDB3(RDB2(RDB1(x)));</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="228" font-weight="400">output=x+0.2·r. Ba RDB; giữ 1×64×H×W.</text>
  </g>
  <g id="L6_B2" data-refs="sr_compare.esrgan:Rdb.forward">
    <rect x="556" y="308" width="504" height="154" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="336" font-weight="700">L6_B2</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="362" font-weight="400">sr_compare.esrgan:Rdb.forward</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="388" font-weight="400">Trong mỗi RDB: conv1(x) → x1;</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="414" font-weight="400">conv2(cat[x,x1]) → x2;</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="440" font-weight="400">conv3(cat[x,x1,x2]) → x3.</text>
  </g>
  <g id="L6_B3" data-refs="sr_compare.esrgan:Rdb.forward">
    <rect x="556" y="520" width="504" height="154" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="548" font-weight="700">L6_B3</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="574" font-weight="400">sr_compare.esrgan:Rdb.forward</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="600" font-weight="400">conv4(cat[x,x1,x2,x3]) → x4. Input</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="626" font-weight="400">channels 64/96/128/160; mỗi conv ra32 rồi</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="652" font-weight="400">LReLU.2.</text>
  </g>
  <g id="L6_B4" data-refs="sr_compare.esrgan:Rdb.forward">
    <rect x="556" y="732" width="504" height="154" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="760" font-weight="700">L6_B4</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="786" font-weight="400">sr_compare.esrgan:Rdb.forward</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="812" font-weight="400">conv5(cat[x,x1,x2,x3,x4]): 192→64 tuyến</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="838" font-weight="400">tính; RDB output=x+0.2·conv5. Conv3×3</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="569" y="864" font-weight="400">zero-pad1; trả về A4.</text>
  </g>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1088" y="106" font-weight="700">C · Thứ tự clamp/round và metric</text>
  <g id="L6_C1" data-refs="sr_compare.esrgan:super_resolve">
    <rect x="1088" y="122" width="504" height="128" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="150" font-weight="700">L6_C1</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="176" font-weight="400">sr_compare.esrgan:super_resolve</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="202" font-weight="400">Từ A6: normalized FP32 batch0 3×4H×4W →</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="228" font-weight="400">finite check → clamp[0,1] → ×255.</text>
  </g>
  <g id="L6_C2" data-refs="sr_compare.esrgan:quantize_values">
    <rect x="1088" y="308" width="504" height="128" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="336" font-weight="700">L6_C2</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="362" font-weight="400">sr_compare.esrgan:quantize_values</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="388" font-weight="400">Finite → clamp[0,255] → torch.round</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="414" font-weight="400">half-to-even → uint8; không half-up.</text>
  </g>
  <g id="L6_C3" data-refs="sr_compare.esrgan:super_resolve">
    <rect x="1088" y="494" width="504" height="154" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="522" font-weight="700">L6_C3</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="548" font-weight="400">sr_compare.esrgan:super_resolve</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="574" font-weight="400">permute/copy RGB uint8 4H×4W×3; lưu kèm</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="600" font-weight="400">prequant_float=(normalized×255) HWC chưa</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="626" font-weight="400">clamp.</text>
  </g>
  <g id="L6_C4" data-refs="sr_compare.metrics:evaluate">
    <rect x="1088" y="706" width="504" height="154" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="734" font-weight="700">L6_C4</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="760" font-weight="400">sr_compare.metrics:evaluate</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="786" font-weight="400">HR/SR cùng shape → RGB uint8 → Y</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="812" font-weight="400">float64/crop4; RGB crop4 phụ. Không đổi</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="1101" y="838" font-weight="400">metric cho GAN.</text>
  </g>
  <path d="M 503 276 V 327" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L6_A1 L6_A2" />
  <path d="M 503 488 V 539" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L6_A2 L6_A3" />
  <path d="M 503 674 V 725" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L6_A3 L6_A4" />
  <path d="M 503 912 V 963" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L6_A4 L6_A5" />
  <path d="M 503 1098 V 1149" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L6_A5 L6_A6" />
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="33" y="937" data-edge="L6_A4 L6_B1">→ L6_B1 · chi tiết</text>
  <path d="M 1035 250 V 301" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L6_B1 L6_B2" />
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="568" y="282">mỗi RDB</text>
  <path d="M 1035 462 V 513" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L6_B2 L6_B3" />
  <path d="M 1035 674 V 725" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L6_B3 L6_B4" />
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="565" y="911" data-edge="L6_B4 L6_A4">→ L6_A4 · trả về</text>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="33" y="1335" data-edge="L6_A6 L6_C1">→ L6_C1 · tiếp</text>
  <path d="M 1567 250 V 301" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L6_C1 L6_C2" />
  <path d="M 1567 436 V 487" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L6_C2 L6_C3" />
  <path d="M 1567 648 V 699" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L6_C3 L6_C4" />
  <line x1="24" x2="1604" y1="1362" y2="1362" stroke="#667085" />
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="24" y="1395">Original ESRGAN architecture; BasicSR converted checkpoint. Conversion chain từ trọng số tác giả UNVERIFIED.</text>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="24" y="1421">RDB scale0.2 và RRDB scale0.2 là hai cấp riêng; RRDB scale toàn output RDB3, không scale (output−x).</text>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="24" y="1447">Nguồn: sr_compare.esrgan:SOURCE_NOTICE; docs/M6_ESRGAN_RESULTS.md. License/training overlap UNVERIFIED.</text>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="24" y="1473">Inference chỉ generator; không có discriminator, không mean shift; không phải Real-ESRGAN.</text>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="24" y="1499">Word: đặt từng panel riêng, rộng ít nhất 8.3 cm (chữ ≥9 pt); không ép toàn lưu đồ vào một trang.</text>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="24" y="1525">SVG giữ đủ panel/ID nối; crop/viewBox theo panel khi công cụ hỗ trợ. Import/export Word còn cần kiểm trực tiếp.</text>
</svg>
