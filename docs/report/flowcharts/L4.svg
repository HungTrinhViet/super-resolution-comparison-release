<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1578" width="1520" height="1578" role="img" aria-labelledby="L4_title L4_desc">
  <title id="L4_title">L4 · FSRCNN(56,12,4) ×4 · Y LR đi thẳng vào mạng</title>
  <desc id="L4_desc">Luồng code có module:hàm chính xác. KF1: LR RGB uint8 khác LR Y float của demo. KF2: Công cụ tạo LR SelfExSR chưa xác minh. KF3: Chroma/RGB là adapter thêm. KF4: Y float từ RGB là metric chính; Y uint8 chỉ diagnostic. KF5: PyTorch FP32 khác MATLAB/NumPy float64. KF6: Hàm màu/lượng tử chưa có MATLAB runtime oracle. KF7: Bản đăng lại gói FSRCNN_test (Chao Dong, ECCV2016); hai bản sao trùng SHA256; gốc CUHK/selection UNVERIFIED. KF8: Readme nói MATLAB tái hiện bài báo C++; demo mặc định×3, đây khóa×4. Nguồn: docs/M4_FSRCNN_RESULTS.md. Word: đặt từng panel riêng, rộng ít nhất 12.0 cm (chữ ≥9 pt); không ép toàn lưu đồ vào một trang. SVG giữ đủ panel/ID nối; crop/viewBox theo panel khi công cụ hỗ trợ. Import/export Word còn cần kiểm trực tiếp. Edges: [["L4_A1", "L4_A2", ""], ["L4_A2", "L4_A3", ""], ["L4_A3", "L4_A4", ""], ["L4_A4", "L4_A5", ""], ["L4_A5", "L4_A6", ""], ["L4_A6", "L4_B1", "tiếp"], ["L4_B1", "L4_B2", ""], ["L4_B2", "L4_B3", ""], ["L4_B3", "L4_B4", ""]]</desc>
  <rect width="1520" height="1578" fill="white" />
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#344054" />
    </marker>
  </defs>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="29" fill="#17212b" x="24" y="38" font-weight="700">L4 · FSRCNN(56,12,4) ×4 · Y LR đi thẳng vào mạng</text>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="24" y="72">Đọc từ trên xuống trong từng panel; liên kết khác panel dùng ID. H,W = kích thước LR; N = 1.</text>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="24" y="106" font-weight="700">A · Nạp, đặc trưng LR, deconv</text>
  <g id="L4_A1" data-refs="sr_compare.fsrcnn:load_fsrcnn sr_compare.fsrcnn:convert_weights">
    <rect x="24" y="122" width="716" height="154" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="150" font-weight="700">L4_A1</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="176" font-weight="400">sr_compare.fsrcnn:load_fsrcnn</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="202" font-weight="400">sr_compare.fsrcnn:convert_weights</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="228" font-weight="400">Ngoài timing: SHA256/MAT cell schema → order=F → FP32</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="254" font-weight="400">strict/eval. Checkpoint đăng lại; xem KF7/KF8.</text>
  </g>
  <g id="L4_A2" data-refs="sr_compare.fsrcnn:super_resolve sr_compare.matlab_color:rgb2ycbcr_uint8">
    <rect x="24" y="334" width="716" height="154" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="362" font-weight="700">L4_A2</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="388" font-weight="400">sr_compare.fsrcnn:super_resolve</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="414" font-weight="400">sr_compare.matlab_color:rgb2ycbcr_uint8</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="440" font-weight="400">RGB uint8 H×W×3 → YCbCr uint8; Y.astype(FP32)/255 → 1×1×H×W;</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="466" font-weight="400">KHÔNG phóng Y trước.</text>
  </g>
  <g id="L4_A3" data-refs="sr_compare.fsrcnn:Fsrcnn.forward sr_compare.fsrcnn:ConvStage.forward">
    <rect x="24" y="546" width="716" height="154" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="574" font-weight="700">L4_A3</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="600" font-weight="400">sr_compare.fsrcnn:Fsrcnn.forward</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="626" font-weight="400">sr_compare.fsrcnn:ConvStage.forward</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="652" font-weight="400">Lớp1: conv5 1→56 replicate2; lớp2: conv1 56→12 pad0; lớp3–6:</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="678" font-weight="400">bốn conv3 12→12 replicate1; lớp7: conv1 12→56 pad0.</text>
  </g>
  <g id="L4_A4" data-refs="sr_compare.fsrcnn:ConvStage.forward sr_compare.fsrcnn:shared_prelu">
    <rect x="24" y="758" width="716" height="154" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="786" font-weight="700">L4_A4</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="812" font-weight="400">sr_compare.fsrcnn:ConvStage.forward</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="838" font-weight="400">sr_compare.fsrcnn:shared_prelu</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="864" font-weight="400">Mỗi lớp1–7: conv+bias rồi max(z,0)+a·min(z,0). Mỗi lớp một</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="890" font-weight="400">scalar a, có thể âm; giữ H×W FP32.</text>
  </g>
  <g id="L4_A5" data-refs="sr_compare.fsrcnn:deconvolve">
    <rect x="24" y="970" width="716" height="128" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="998" font-weight="700">L4_A5</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="1024" font-weight="400">sr_compare.fsrcnn:deconvolve</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="1050" font-weight="400">1×56×H×W → replicate1 → conv_transpose2d9, stride4, padding0,</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="1076" font-weight="400">output_padding0, bias=None; không lật kernel.</text>
  </g>
  <g id="L4_A6" data-refs="sr_compare.fsrcnn:deconvolve">
    <rect x="24" y="1156" width="716" height="128" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="1184" font-weight="700">L4_A6</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="1210" font-weight="400">sr_compare.fsrcnn:deconvolve</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="1236" font-weight="400">Raw 1×1×(4H+13)×(4W+13) → crop [8:8+4H,8:8+4W] → bias một</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="37" y="1262" font-weight="400">lần. Không PReLU lớp8. Tiếp B1.</text>
  </g>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="768" y="106" font-weight="700">B · Y/chroma/RGB sau forward</text>
  <g id="L4_B1" data-refs="sr_compare.fsrcnn:super_resolve sr_compare.matlab_color:matlab_uint8_round">
    <rect x="768" y="122" width="716" height="154" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="150" font-weight="700">L4_B1</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="176" font-weight="400">sr_compare.fsrcnn:super_resolve</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="202" font-weight="400">sr_compare.matlab_color:matlab_uint8_round</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="228" font-weight="400">Finite Y float FP32 4H×4W → cast float64 ×255 →</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="254" font-weight="400">half-away-from-zero rồi saturate[0,255] → Y uint8.</text>
  </g>
  <g id="L4_B2" data-refs="sr_compare.matlab_resize:imresize_bicubic_float sr_compare.matlab_color:matlab_uint8_round">
    <rect x="768" y="334" width="716" height="154" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="362" font-weight="700">L4_B2</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="388" font-weight="400">sr_compare.matlab_resize:imresize_bicubic_float</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="414" font-weight="400">sr_compare.matlab_color:matlab_uint8_round</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="440" font-weight="400">Cb rồi Cr: LR uint8 → float64 bicubic×4 (symmetric, chưa</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="466" font-weight="400">lượng tử) → round/saturate mỗi kênh.</text>
  </g>
  <g id="L4_B3" data-refs="sr_compare.matlab_color:ycbcr2rgb_uint8 sr_compare.matlab_color:ycbcr2rgb_float sr_compare.matlab_color:matlab_uint8_round">
    <rect x="768" y="546" width="716" height="180" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="574" font-weight="700">L4_B3</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="600" font-weight="400">sr_compare.matlab_color:ycbcr2rgb_uint8</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="626" font-weight="400">sr_compare.matlab_color:ycbcr2rgb_float</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="652" font-weight="400">sr_compare.matlab_color:matlab_uint8_round</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="678" font-weight="400">Stack Y,Cb,Cr uint8 4H×4W×3 → inverse BT.601 float64 →</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="704" font-weight="400">round/saturate → RGB uint8.</text>
  </g>
  <g id="L4_B4" data-refs="sr_compare.metrics:evaluate">
    <rect x="768" y="784" width="716" height="128" rx="9" fill="#f8fafc" stroke="#344054" stroke-width="1.5" />
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="812" font-weight="700">L4_B4</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="838" font-weight="400">sr_compare.metrics:evaluate</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="864" font-weight="400">Chỉ sau RGB uint8: HR/SR shape check → Y float64 → crop4 →</text>
    <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="781" y="890" font-weight="400">metric L1. Y uint8 trực tiếp chỉ diagnostic.</text>
  </g>
  <path d="M 715 276 V 327" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L4_A1 L4_A2" />
  <path d="M 715 488 V 539" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L4_A2 L4_A3" />
  <path d="M 715 700 V 751" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L4_A3 L4_A4" />
  <path d="M 715 912 V 963" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L4_A4 L4_A5" />
  <path d="M 715 1098 V 1149" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L4_A5 L4_A6" />
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="33" y="1309" data-edge="L4_A6 L4_B1">→ L4_B1 · tiếp</text>
  <path d="M 1459 276 V 327" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L4_B1 L4_B2" />
  <path d="M 1459 488 V 539" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L4_B2 L4_B3" />
  <path d="M 1459 726 V 777" stroke="#344054" stroke-width="1.5" fill="none" marker-end="url(#arrow)" data-edge="L4_B3 L4_B4" />
  <line x1="24" x2="1496" y1="1336" y2="1336" stroke="#667085" />
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="24" y="1369">KF1: LR RGB uint8 khác LR Y float của demo. KF2: Công cụ tạo LR SelfExSR chưa xác minh.</text>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="24" y="1395">KF3: Chroma/RGB là adapter thêm. KF4: Y float từ RGB là metric chính; Y uint8 chỉ diagnostic.</text>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="24" y="1421">KF5: PyTorch FP32 khác MATLAB/NumPy float64. KF6: Hàm màu/lượng tử chưa có MATLAB runtime oracle.</text>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="24" y="1447">KF7: Bản đăng lại gói FSRCNN_test (Chao Dong, ECCV2016); hai bản sao trùng SHA256; gốc CUHK/selection UNVERIFIED.</text>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="24" y="1473">KF8: Readme nói MATLAB tái hiện bài báo C++; demo mặc định×3, đây khóa×4. Nguồn: docs/M4_FSRCNN_RESULTS.md.</text>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="24" y="1499">Word: đặt từng panel riêng, rộng ít nhất 12.0 cm (chữ ≥9 pt); không ép toàn lưu đồ vào một trang.</text>
  <text font-family="Arial, DejaVu Sans, sans-serif" font-size="21" fill="#17212b" x="24" y="1525">SVG giữ đủ panel/ID nối; crop/viewBox theo panel khi công cụ hỗ trợ. Import/export Word còn cần kiểm trực tiếp.</text>
</svg>
